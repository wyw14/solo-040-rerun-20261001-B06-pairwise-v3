<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Chamber</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a aria-current="page" href="/chamber">Chamber</a><a href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main><div class="page-title"><div><h1>Chamber situation</h1><div class="muted">Gate, cycle, queue, signal and emergency state</div></div><button id="refresh">Refresh</button></div><div class="grid" id="chambers"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,shortID,setMessage}=window.LockFlow; const host=document.querySelector('#chambers'); const message=document.querySelector('#message');
const blockingStatuses=new Set(['draining','completed','failed']);
async function load(){
  const items=await api('/api/chambers');
  host.innerHTML=items.map((item)=>{
    const emergency=item.emergency?.status||'idle';
    const blocking=blockingStatuses.has(emergency);
    const commands=(item.pending_commands||[]).map((command)=>`<tr><td>${command.device}</td><td>${command.action}</td><td>${command.state}</td></tr>`).join('')
      || '<tr><td colspan="3" class="muted">None</td></tr>';
    return `<section class="panel"><h2>${item.chamber_id}</h2>
      <div class="metrics"><div class="metric">Stage<strong>${item.cycle?.stage||'idle'}</strong></div><div class="metric">Upstream<strong>${item.gates?.upstream||'-'}</strong></div><div class="metric">Downstream<strong>${item.gates?.downstream||'-'}</strong></div><div class="metric">Pending cmds<strong>${item.pending_commands?.length||0}</strong></div></div>
      <table>
        <tr><th>Cycle</th><td>${shortID(item.cycle?.id)}</td></tr>
        <tr><th>Queue</th><td>${item.queue?.length||0} vessel(s)</td></tr>
        <tr><th>Emergency</th><td style="${blocking?'color:#ef6f6c;font-weight:600':''}">${emergency}${item.emergency?.message?` — ${item.emergency.message}`:''}</td></tr>
      </table>
      <table><thead><tr><th>Device</th><th>Action</th><th>State</th></tr></thead><tbody>${commands}</tbody></table>
      ${blocking?'<div class="muted">Chamber is locked: acknowledge &amp; reset on the Interlocks page before starting a new transit.</div>':''}
    </section>`;
  }).join('');
  setMessage(message,'');
}
document.querySelector('#refresh').addEventListener('click',()=>load().catch((e)=>setMessage(message,e.message)));
load().catch((e)=>setMessage(message,e.message));
setInterval(()=>load().catch(()=>{}),5000);
</script></body></html>
