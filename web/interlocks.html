<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Interlocks</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a href="/chamber">Chamber</a><a aria-current="page" href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main><div class="page-title"><div><h1>Interlock control</h1><div class="muted">Mutual exclusion and emergency equipment state</div></div></div><div class="grid" id="interlock-grid"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,setMessage,withBusy}=window.LockFlow; const host=document.querySelector('#interlock-grid'); const message=document.querySelector('#message');
async function stop(chamber,button){await withBusy(button,async()=>{try{await api(`/api/chambers/${chamber}/emergency`,{method:'POST',body:'{}'});await load();}catch(e){setMessage(message,e.message);}});}
async function reset(chamber,button){await withBusy(button,async()=>{try{await api(`/api/chambers/${chamber}/emergency/reset`,{method:'POST',body:'{}'});setMessage(message,`${chamber} emergency reset.`);await load();}catch(e){setMessage(message,e.message);}});}
async function load(){const data=await api('/api/interlocks');host.innerHTML=Object.entries(data).filter(([id])=>id!=='signal_handoffs').map(([id,item])=>{const status=item.emergency.status;const blocking=status==='draining'||status==='completed'||status==='failed';const canReset=status==='completed'||status==='failed';const note=status==='completed'?'reset required before new transit':(status==='draining'?`${item.pending_equipment} device(s) unconfirmed`:status);const resetBtn=canReset?`<button data-reset="${id}">Reset lockdown</button>`:'';const stopDisabled=blocking?' disabled':'';return `<section class="panel"><h2>${id}</h2><table><tr><th>Emergency</th><td>${status}${note&&note!==status?` <span class="muted">(${note})</span>`:''}</td></tr><tr><th>Level</th><td>${item.equipment.LevelM??item.equipment.level_m??0} m</td></tr><tr><th>Pending commands</th><td>${item.pending_commands.length}</td></tr><tr><th>Equipment unconfirmed</th><td>${item.pending_equipment}</td></tr></table><button class="danger" data-stop="${id}"${stopDisabled}>Emergency stop</button> ${resetBtn}</section>`;}).join('');host.querySelectorAll('[data-stop]').forEach((button)=>button.addEventListener('click',()=>stop(button.dataset.stop,button)));host.querySelectorAll('[data-reset]').forEach((button)=>button.addEventListener('click',()=>reset(button.dataset.reset,button)));}
load().catch((e)=>setMessage(message,e.message));
setInterval(()=>load().catch(()=>{}),5000);
</script></body></html>
